name: Site or accessibility problem
description: Report a search, navigation, display, or accessibility defect.
title: "[Site] "
body:
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior, and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and assistive technology (if relevant)
