name: Validate wiki
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate content
        run: |
          python scripts/build.py
          for script in scripts/check*.py; do python "$script"; done
          git diff --exit-code
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check all pages in Chromium
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/mzwiki-http.log 2>&1 &
          export MZWIKI_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python scripts/browser_check.py
